<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Commute live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1b1b19;--mute:#6a6a64;--line:#e2e2dc;--ok:#1f8a4c;--warn:#c77700;--bad:#c5302c}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1d1d1b;--ink:#efefe9;--mute:#a1a19a;--line:#30302c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:8px 10px 24px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:7px 4px;font:inherit;font-size:14px}
.seg button.on{background:var(--ink);color:var(--card);font-weight:700}
.ico{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 11px;font:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.hero{background:var(--ink);color:var(--card);border-color:var(--ink)}
.hero .big{font-size:33px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .mute{color:inherit;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:6px 11px;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--card);font-weight:700}
.favrow{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.favrow input{margin:0}
.tlA{list-style:none;margin:4px 0 8px;padding:0 4px;font-size:14px}
.tlA li{display:flex;gap:8px;padding:3px 0;align-items:baseline}
.tlA .t{width:42px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.tlA .x{flex:1}
.tlA .w{color:var(--mute)}
.tlA .bad{color:var(--bad);font-weight:700}
.mg{font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:6px;padding:0 5px;white-space:nowrap}
.hero .big small{font-size:18px;font-weight:600;opacity:.8;white-space:nowrap}
.hero{padding:14px}
.hero .l2{font-size:17px;margin-top:6px}
.hero .l3{margin-top:8px;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.hero .l4{margin-top:6px;font-size:15px}
.hero .l4 u{cursor:pointer}
.hero.stale .big{opacity:.45}
.pill.n{background:#8a8a84;color:#fff}
.pill{margin-left:0}
.rte{display:flex;gap:8px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.rte:first-of-type{border-top:0}
.rte.on{background:var(--bg);outline:2px solid var(--ink)}
.rte .dot{width:14px;height:14px;border-radius:50%;flex:none}
.rte .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.rte .rk{font-size:11px;color:var(--mute);display:block}
.dt{border-top:1px solid var(--line);padding:9px 0}
.dt:first-of-type{border-top:0;padding-top:0}
.dt>summary{font-weight:700}
.why{font-size:14px;padding:3px 0}
.rec{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rec:first-of-type{border-top:0;padding-top:0}
.rec .tm{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.rec .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.strip{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:6px;gap:1px}
.strip span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;min-width:3px;overflow:hidden;white-space:nowrap}
.strip .w{background:repeating-linear-gradient(45deg,var(--bad),var(--bad) 3px,transparent 3px,transparent 6px);opacity:.75}
.strip .f{background:var(--line)}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.pill.g{background:var(--ok);color:#fff}.pill.o{background:var(--warn);color:#fff}.pill.r{background:var(--bad);color:#fff}
.ls{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.ls:first-of-type{border-top:0}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ctl input[type=time]{width:auto;flex:none;margin:0;padding:7px 8px;font-size:16px}
.hero .sub{font-size:17px;margin-top:4px}
.mute{color:var(--mute);font-size:13px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 8px}
.b{display:inline-block;min-width:26px;padding:1px 6px;border-radius:6px;font-weight:800;font-size:13px;text-align:center;vertical-align:middle}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.chain i{color:var(--mute);font-style:normal;font-size:12px}
.j{border-top:1px solid var(--line);padding:10px 0;cursor:pointer}
.j:first-of-type{border-top:0;padding-top:0}
.j.sel .jh{font-weight:700}
.jh{display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums;flex-wrap:wrap}.jh>span:first-child{white-space:nowrap}
.jh .d{margin-left:auto;color:var(--mute);font-size:13px;font-weight:400}
.tl{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.tl li{display:flex;gap:8px;padding:4px 0}
.tl .t{width:42px;flex:none;font-variant-numeric:tabular-nums;font-weight:700}
.tl .x{flex:1}
.tl .walk,.tl .wait{color:var(--mute)}
.tight{color:var(--bad);font-weight:700}
.tag{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 4px;color:var(--mute);margin-left:4px;white-space:nowrap}
.tag.rt{border-color:var(--ok);color:var(--ok)}
.late{color:var(--bad);font-weight:700}
.al{display:flex;gap:8px;padding:5px 0;font-size:14px;border-top:1px solid var(--line)}
.al:first-of-type{border-top:0}
.al .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
#map{height:240px;border-radius:10px;z-index:0}
details summary{cursor:pointer;font-weight:700}
.row{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.row .t{width:46px;font-weight:700;flex:none}
.star{font-weight:700}
input{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0}
.btn{display:block;width:100%;padding:11px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font:inherit;font-weight:700;margin-top:8px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.res{border:1px solid var(--line);border-radius:10px;margin:4px 0;overflow:hidden}
.res div{padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.res div:first-child{border-top:0}
.picked{font-size:14px;color:var(--ok);font-weight:700}
.err{background:#fde8e6;color:#7d1512;border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px;white-space:pre-wrap}
label{font-size:13px;color:var(--mute);display:block;margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
const ROOT='https://prim.iledefrance-mobilites.fr/marketplace', NAV=ROOT+'/v2/navitia';
const LSK='commute-live-v1', RERC='line:IDFM:C01727';
const app=document.getElementById('app');
let cfg=load(); if(!cfg.favs)cfg.favs=[];
let  S={dir:null,routes:[],r:0,k:0,dis:[],err:null,at:null,busy:false,board:null,boardFor:null,target:null,lines:[],edit:false,open:{},loaded:false};
const LR={};
let map=null, layer=null, tickT=null, refT=null;

/* ---------- utilità ---------- */
function load(){try{return JSON.parse(localStorage.getItem(LSK))||{};}catch(e){return {};}}
function save(){try{localStorage.setItem(LSK,JSON.stringify(cfg));}catch(e){}}
const ta=document.createElement('textarea');
function dec(s){ta.innerHTML=String(s==null?'':s).replace(/<[^>]+>/g,' ');return ta.value.replace(/\s+/g,' ').trim();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nd(s){if(!s)return null;const m=/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)/.exec(s);return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]):null;}
function hm(d){return d?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'—';}
function mins(sec){return Math.max(0,Math.round(sec/60));}
function short(n){return String(n||'').replace(/\s*\([^)]*\)\s*$/,'');}
function badge(di){const c=/^[0-9a-f]{6}$/i.test(di.color||'')?di.color:'666666',t=/^[0-9a-f]{6}$/i.test(di.text_color||'')?di.text_color:'FFFFFF';
  return '<span class="b" style="background:#'+c+';color:#'+t+'">'+esc(di.code||di.commercial_mode||'?')+'</span>';}
async function api(url){
  let r; try{r=await fetch(url,{headers:{apikey:cfg.key||'',Accept:'application/json'}});}
  catch(e){throw new Error('Rete o CORS: '+e.message);}
  if(r.status===401||r.status===403) throw new Error('Chiave rifiutata (HTTP '+r.status+'). Controlla la chiave nelle impostazioni.');
  if(r.status===429) throw new Error('Quota PRIM superata (HTTP 429). Riprova più tardi.');
  let j=null; try{j=await r.json();}catch(e){}
  if(!r.ok && !(j&&j.journeys)) {const e=new Error('PRIM HTTP '+r.status+(j&&j.error&&j.error.message?': '+j.error.message:''));e.status=r.status;e.body=j;throw e;}
  return j;
}
const pt=j=>(j.sections||[]).filter(s=>s.type==='public_transport');
const walkOf=j=>{const d=(j.durations||{}).walking;return typeof d==='number'?d:(j.sections||[]).filter(x=>x.type==='street_network'||x.type==='crow_fly'||x.type==='transfer').reduce((t,x)=>t+(x.duration||0),0);};
const MG=()=>Math.max(0,Math.min(30,+cfg.margin||0));
const leave=j=>new Date(nd(j.departure_date_time).getTime()-MG()*60e3);
const MGT=()=>MG()?' <span class="mg">margine '+MG()+' min incluso</span>':'';
const ORD={basso:0,medio:1,nv:2,alto:3};
const waitOf=j=>(j.sections||[]).filter(s=>s.type==='waiting').reduce((a,s)=>a+(s.duration||0),0);
const fmtNav=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
function targetDate(){ if(cfg.when!=='arr'||!/^\d\d:\d\d$/.test(cfg.arr||''))return null;
  const d=new Date(); d.setHours(+cfg.arr.slice(0,2),+cfg.arr.slice(3),0,0); if(d.getTime()<Date.now()+5*60e3)d.setDate(d.getDate()+1); return d; }
function ends(){ if(S.dir==='altro')return [cfg.cfrom,cfg.cto]; return S.dir==='andata'?[cfg.home,cfg.work]:[cfg.work,cfg.home]; }
function rerInfo(j){const s=pt(j).find(x=>lineId(x)===RERC);return s?'RER C '+hm(nd(s.departure_date_time))+' da '+short((s.from||{}).name):'';}
function disIds(j){const o=new Set();pt(j).forEach(s=>((s.display_informations||{}).links||[]).forEach(l=>{if(l.type==='disruption'&&l.id)o.add(l.id);}));return o;}
function strip(j){const tot=Math.max(1,j.duration||1);return '<div class="strip">'+(j.sections||[]).map(s=>{const d=s.duration||0;if(d<=0)return '';
  if(s.type==='public_transport'){const di=s.display_informations||{};return '<span style="flex:'+d+' 0 22px;background:#'+esc(di.color||'666')+';color:#'+esc(di.text_color||'fff')+'">'+esc(di.code||'')+'</span>';}
  return '<span class="'+(s.type==='waiting'?'w':'f')+'" style="flex:'+d+' 0 0" title="'+(s.type==='waiting'?'attesa':'a piedi')+' '+mins(d)+' min"></span>';}).join('')+'</div>';}
const nameOf=p=>p?(p.label||short(p.name)):'';
function favList(){const L=[];if(cfg.home)L.push(Object.assign({label:'Casa'},cfg.home));if(cfg.work)L.push(Object.assign({label:'Lavoro'},cfg.work));return L.concat(cfg.favs||[]);}
async function pickFav(side,i){
  const fv=favList()[i]; if(!fv)return;
  if(!fv.id){ /* luogo salvato solo come testo: lo cerco una volta su PRIM e memorizzo il primo risultato */
    const j=await api(NAV+'/places?q='+encodeURIComponent(fv.q||fv.label)+'&count=5');
    const p=(j.places||[]).find(x=>['address','stop_area','poi'].includes(x.embedded_type));
    if(!p)throw new Error('Luogo non trovato: '+(fv.q||fv.label));
    const t=(cfg.favs||[]).find(x=>x.label===fv.label); if(t){t.id=p.id;t.name=p.name;} fv.id=p.id; fv.name=p.name;
  }
  cfg[side]={id:fv.id,name:fv.name,label:fv.label}; save();
}
function placeSearch(host,label,cur,onPick){
  host.innerHTML='<label>'+label+'</label><input placeholder="cerca indirizzo o fermata…"><div class="rs"></div><div class="picked">'+(cur?'✓ '+esc(cur.name):'')+'</div>';
  const inp=host.querySelector('input'),rs=host.querySelector('.rs'),pk=host.querySelector('.picked');let t=null;
  inp.oninput=()=>{clearTimeout(t);const q=inp.value.trim();if(q.length<3){rs.innerHTML='';return;}
    t=setTimeout(async()=>{ if(!cfg.key){rs.innerHTML='<div class="mute">Inserisci prima la chiave.</div>';return;}
      try{const j=await api(NAV+'/places?q='+encodeURIComponent(q)+'&count=6');
        const P=(j.places||[]).filter(p=>['address','stop_area','poi'].includes(p.embedded_type));
        rs.innerHTML=P.length?'<div class="res">'+P.map((p,i)=>'<div data-i="'+i+'">'+esc(p.name)+' <span class="tag">'+(p.embedded_type==='stop_area'?'fermata':p.embedded_type==='poi'?'luogo':'indirizzo')+'</span></div>').join('')+'</div>':'<div class="mute">Nessun risultato.</div>';
        rs.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{const p=P[+el.dataset.i];pk.textContent='✓ '+p.name;rs.innerHTML='';inp.value='';onPick({id:p.id,name:p.name});});
      }catch(e){rs.innerHTML='<div class="err">'+esc(e.message)+'</div>';}
    },350);};
}
function lineId(s){const l=(s.links||[]).find(x=>x.type==='line');return l?l.id:'';}
function usesRerC(j){return pt(j).some(s=>lineId(s)===RERC);}

/* ---------- impostazioni ---------- */
function setup(msg){
  stop();
  const d={key:cfg.key||'',home:cfg.home||null,work:cfg.work||null};
  app.innerHTML='<div class="card"><h2>Impostazioni</h2>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+
   '<p class="mute">Chiave e indirizzi restano in questo browser. Vanno solo a prim.iledefrance-mobilites.fr.</p>'+
   '<label>Chiave API PRIM</label><input id="k" type="password" autocomplete="off" value="'+esc(d.key)+'">'+
   '<div id="h_home"></div><div id="h_work"></div>'+
   '<label>Luoghi salvati (per "Altro")</label><div id="favs"></div>'+
   '<label>Margine di sicurezza: esci N minuti prima (0–30)</label><input id="mg" type="number" min="0" max="30" inputmode="numeric" value="'+MG()+'">'+
   '<button class="btn" id="sv">Salva</button>'+(cfg.key&&cfg.home&&cfg.work?'<button class="btn alt" id="cn">Annulla</button>':'')+'</div>';
  const $=id=>document.getElementById(id);
  $('k').oninput=()=>{cfg.key=$('k').value.trim();};
  const drawF=()=>{$('favs').innerHTML=(cfg.favs||[]).length?(cfg.favs||[]).map((x,i)=>'<div class="favrow"><span style="flex:1"><b>'+esc(x.label)+'</b>'+(x.name?' <span class="mute">'+esc(x.name)+'</span>':' <span class="mute">'+esc(x.q||'')+' (da cercare al primo uso)</span>')+'</span><button class="ico" data-fd="'+i+'" aria-label="Rimuovi">✕</button></div>').join(''):'<div class="mute">Nessuno. Aggiungili da "Altro": cerca un luogo, poi "Salva".</div>';
    $('favs').querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{cfg.favs.splice(+b.dataset.fd,1);save();drawF();});};
  drawF();
  placeSearch($('h_home'),'Casa',d.home,p=>d.home=p);
  placeSearch($('h_work'),'Lavoro',d.work,p=>d.work=p);
  $('sv').onclick=()=>{d.key=$('k').value.trim();if(!d.key||!d.home||!d.work){alertIn('Servono chiave, casa e lavoro.');return;}Object.assign(cfg,d);cfg.margin=Math.max(0,Math.min(30,Math.round(+$('mg').value||0)));save();start();};
  if($('cn'))$('cn').onclick=()=>{cfg=load();start();};
  function alertIn(t){let e=app.querySelector('.err');if(!e){e=document.createElement('div');e.className='err';app.querySelector('.card').prepend(e);}e.textContent=t;}
}

/* ---------- dati ---------- */
async function journeys(extra){
  const [a,b]=ends();
  const base=NAV+'/journeys?from='+encodeURIComponent(a.id)+'&to='+encodeURIComponent(b.id)+'&data_freshness=realtime'+
    (S.target?'&datetime='+fmtNav(S.target)+'&datetime_represents=arrival':'')+(extra||'');
  try{return await api(base+'&min_nb_journeys=6');}
  catch(e){if(e.status===400||e.status===404||e.status===500)return await api(base+'&count=3');throw e;}
}
function cmp(x,y){return S.target?nd(y.departure_date_time)-nd(x.departure_date_time)
  :nd(x.arrival_date_time)-nd(y.arrival_date_time)||nd(y.departure_date_time)-nd(x.departure_date_time);}
function clean(j){
  const now=Date.now(), T=S.target?S.target.getTime():0;
  return ((j&&j.journeys)||[]).filter(x=>pt(x).length).filter(x=>{const d=nd(x.departure_date_time),a=nd(x.arrival_date_time);
    return d&&a&&d.getTime()>now-60e3&&(!T||a.getTime()<=T+60e3);});
}
const sigOf=j=>pt(j).map(s=>(s.display_informations||{}).code||'?').join('>');
const cur=()=>{const r=S.routes[S.r];return r?r.js[Math.min(S.k,r.js.length-1)]:null;};
function stopIds(o){const out=new Set();(function w(x){if(!x)return;if(typeof x==='string'){if(/^stop_(area|point):/.test(x))out.add(x);return;}
  if(Array.isArray(x)){x.forEach(w);return;}if(typeof x==='object')Object.keys(x).forEach(k=>w(x[k]));})(o);return out;}
function normD(d){
  if(!d||d.status!=='active'||(d.tags||[]).some(t=>/ascenseur|escalator/i.test(t)))return null;
  const nowD=new Date(), per=d.application_periods||[];
  if(per.length&&!per.some(p=>{const b=nd(p.begin),e=nd(p.end);return (!b||b<=nowD)&&(!e||e>=nowD);}))return null;
  const m=(d.messages||[]).find(x=>((x.channel||{}).types||[]).includes('title'))||(d.messages||[])[0];
  const t=dec(m&&m.text)||dec(d.cause); if(!t)return null;
  const sv=d.severity||{}, io=d.impacted_objects||[];
  return {id:d.id,t,e:sv.effect||'',p:sv.priority==null?99:sv.priority,c:sv.color||'',ids:stopIds(io),sect:/impacted_section/.test(JSON.stringify(io))};
}
const lv=d=>/NO_SERVICE/.test(d.e)?3:(!d.e||/SIGNIFICANT_DELAYS|REDUCED_SERVICE|DETOUR|MODIFIED_SERVICE|UNKNOWN/.test(d.e))?2:1;
/* Rischio di un itinerario: regole fisse su perturbazioni, ritardi e coincidenze. */
function riskOf(j){
  let lvl=0,nv=false; const reasons=[],notes=[],seen=new Set();
  const add=(l,t)=>{if(seen.has(t))return;seen.add(t);if(l>=2)reasons.push({l,t});else notes.push(t);lvl=Math.max(lvl,l);};
  const secs=j.sections||[];
  secs.forEach((s,i)=>{
    if(s.type==='waiting'&&(s.duration||0)<120){const nx=secs.slice(i+1).find(x=>x.type==='public_transport');
      add(2,'Coincidenza di '+mins(s.duration)+' min'+(nx?' a '+short((nx.from||{}).name):''));}
    if(s.type!=='public_transport')return;
    const di=s.display_informations||{}, id=lineId(s), my=stopIds([s.from,s.to,s.stop_date_times]);
    const links=new Set((di.links||[]).filter(l=>l.type==='disruption').map(l=>l.id));
    const bd=nd(s.base_departure_date_time), d=nd(s.departure_date_time), late=bd&&d?Math.round((d-bd)/60e3):0;
